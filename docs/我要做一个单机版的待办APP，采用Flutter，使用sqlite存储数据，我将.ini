我要做一个单机版的待办APP，采用Flutter，使用sqlite存储数据，我将向你说明我的APP的功能，需要你为我生成sqlite的数据表语句，以及需要用到的方法（CRUD）（简单描述即可，此处无需生成代码），功能如下：
1. 待办分为常规、周期待办两种形式
2. 常规待办：
2.1 相关字段：待办标题、备注、创建日期、更新日期、提醒日期、提醒时间、优先级颜色、完成状态，类型（日常、周期）
2.2 相关功能：列出所有待办（此处所有待办是包含周期的待办事项的），新增待办、编辑待办、删除待办
3. 周期待办
3.1 周期待办简单描述为，可固定某个周期循环的提醒事项，如：每两天一个周期，指定周期第一天9点提醒我喝牛奶，周期第二天9点提醒我喝豆浆，周期重复性循环
3.2 周期相关字段：周期名称、周期开始时间，周期天数（一天、二天、每周、每月、每年）、创建时间、更新时间、备注
3.3 周期待办事项相关字段：待办标题、备注、创建日期、更新日期、提醒日期、提醒时间（依据周期的周期时间而非具体时间）、优先级颜色、完成状态、类型（日常、周期）
4. 现介绍APP每个页面的功能：
4.1 待办页面：展示今日待办事项进度（如今日总计多少个待办、已完成多少待办）、列出待处理、已完成的待办事项、每个待办事项标注标签如：周期、今日、日期、昨天、已逾期、2天后等此种标签，可编辑待办、删除待办、新增待办
4.2 周期页面：可新增周期、删除周期、编辑周期、列出所有周期、点击周期进入管理周期待办
4.3 日程页面：显示日历样式控件，点击某个日期展示当天日期的所有待办事项、包含日常和周期待办
4.4 统计页面：一些指标统计，我还没具体规划好哪些指标，可以提供一些给我做为参考



修改：周期没有提醒时间点，而是周期内的待办事项可以设置某个时间点提醒，另外周期并非只有周月年，而是可以自定义周期，依据天数为主